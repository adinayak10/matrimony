# Baseline response headers. Installed at
# /etc/nginx/snippets/banjaramatch/security-headers.conf by deploy.sh.
# add_header in a location replaces the parent set, so include this in
# every location that adds its own headers. No X-Frame-Options here:
# the web app sends DENY itself; admin.conf adds SAMEORIGIN per location.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
