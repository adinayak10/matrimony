# Shared proxy settings for non-websocket locations.
# Installed at /etc/nginx/snippets/banjaramatch/proxy.conf by deploy.sh.
# Connection "" is required for upstream keepalive; websocket locations
# set Upgrade/Connection themselves and do not include this file.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_read_timeout 60s;
