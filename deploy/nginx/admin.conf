# admin.banjaramatch.com -> banjaramatch-admin (127.0.0.1:4001)
# Installed as /etc/nginx/sites-available/admin.banjaramatch.com by deploy.sh (copy, not symlink).
# server_name, listen, ssl_certificate*, options-ssl-nginx and ssl_dhparam lines are certbot-managed: keep as-is.
# No root/index/try_files: every non-asset path reaches the admin server so its auth applies.

upstream bm_admin {
    server 127.0.0.1:4001;
    keepalive 16;
}

server {
    server_name admin.banjaramatch.com;

    access_log /var/log/nginx/admin.banjaramatch.com.access.log;
    error_log /var/log/nginx/admin.banjaramatch.com.error.log;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    include /etc/nginx/snippets/banjaramatch/security-headers.conf;

    # Unversioned assets: short cache, revalidate (the app appends ?v=RELEASE_SHA).
    location ^~ /css/ {
        alias /var/www/banjaramatch/apps/admin/public/css/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=600, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        include /etc/nginx/snippets/banjaramatch/security-headers.conf;
    }

    location ^~ /js/ {
        alias /var/www/banjaramatch/apps/admin/public/js/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=600, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        include /etc/nginx/snippets/banjaramatch/security-headers.conf;
    }

    location ^~ /img/ {
        alias /var/www/banjaramatch/apps/admin/public/img/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=600, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        include /etc/nginx/snippets/banjaramatch/security-headers.conf;
    }

    location ^~ /vendor/ {
        alias /var/www/banjaramatch/apps/admin/public/vendor/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=600, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        include /etc/nginx/snippets/banjaramatch/security-headers.conf;
    }

    location = /robots.txt {
        proxy_pass http://bm_admin;
        include /etc/nginx/snippets/banjaramatch/proxy.conf;
    }

    location = /health {
        proxy_pass http://bm_admin;
        include /etc/nginx/snippets/banjaramatch/proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        include /etc/nginx/snippets/banjaramatch/security-headers.conf;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }

    # Everything else: the admin server (APK uploads traverse this host on their way to the API)
    location / {
        proxy_pass http://bm_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        client_max_body_size 150m;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.banjaramatch.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.banjaramatch.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = admin.banjaramatch.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name admin.banjaramatch.com;
    server_tokens off;
    return 404; # managed by Certbot
}
