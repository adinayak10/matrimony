# api.banjaramatch.com -> banjaramatch-api (127.0.0.1:4002)
# Installed as /etc/nginx/sites-available/api.banjaramatch.com by deploy.sh (copy, not symlink).
# server_name, listen, ssl_certificate*, options-ssl-nginx and ssl_dhparam lines are certbot-managed: keep as-is.
# Rate-limit zones bm_auth / bm_api come from conf.d/banjaramatch-ratelimit.conf.

upstream bm_api {
    server 127.0.0.1:4002;
    keepalive 16;
}

server {
    server_name api.banjaramatch.com;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    # Default: multi-photo multipart needs headroom above multer's 5 MB per file.
    client_max_body_size 30m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/snippets/banjaramatch/security-headers.conf;

    location = /health {
        proxy_pass http://bm_api;
        include /etc/nginx/snippets/banjaramatch/proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        include /etc/nginx/snippets/banjaramatch/security-headers.conf;
    }

    # Old deploy webhook path, retired.
    location = /webhook {
        return 410;
    }

    # APK upload from the admin panel
    location = /api/admin/apk/upload {
        proxy_pass http://bm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 150m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Profile photo uploads (multer: 10 files x 5 MB)
    location ~ ^/api/(editProfile|uploadUserPhotos)$ {
        proxy_pass http://bm_api;
        include /etc/nginx/snippets/banjaramatch/proxy.conf;
        client_max_body_size 60m;
    }

    # Login / OTP / public forms: tight per-IP limit
    location ~ ^/api/(auth/|admin/auth/login|contact/submit|beta-tester/submit) {
        limit_req zone=bm_auth burst=10 nodelay;
        proxy_pass http://bm_api;
        include /etc/nginx/snippets/banjaramatch/proxy.conf;
    }

    # User uploads served straight from the shared dir. Only the three known
    # folders with safe file names and known extensions; everything else 404.
    location ^~ /uploads/ {
        alias /var/www/banjaramatch-shared/uploads/;
        autoindex off;

        location ~ ^/uploads/(profile_images|apk|blog_images)/[A-Za-z0-9_.-]+\.(jpe?g|png|webp|apk)$ {
            try_files $uri =404;
            include /etc/nginx/mime.types;
            types { application/vnd.android.package-archive apk; }
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        return 404;
    }

    location /socket.io/ {
        proxy_pass http://bm_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=bm_api burst=50 nodelay;
        proxy_pass http://bm_api;
        include /etc/nginx/snippets/banjaramatch/proxy.conf;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/api.banjaramatch.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.banjaramatch.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.banjaramatch.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name api.banjaramatch.com;
    server_tokens off;
    return 404; # managed by Certbot
}
