# http-context directives shared by the banjaramatch site files.
# Installed at /etc/nginx/conf.d/banjaramatch-ratelimit.conf by deploy.sh.

# Rate-limit zones used by api.conf.
limit_req_zone $binary_remote_addr zone=bm_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=bm_api:10m rate=20r/s;
limit_req_status 429;

# Connection header for websocket-capable locations: "upgrade" during a
# handshake, empty otherwise so upstream keepalive keeps working.
map $http_upgrade $bm_connection {
    default "";
    upgrade "upgrade";
}
