# banjaramatch.com / www.banjaramatch.com -> banjaramatch-web (127.0.0.1:4000)
# Installed as /etc/nginx/sites-available/banjaramatch.com by deploy.sh (copy, not symlink).
# server_name, listen, ssl_certificate*, options-ssl-nginx and ssl_dhparam lines are certbot-managed: keep as-is.

upstream bm_web {
    server 127.0.0.1:4000;
    keepalive 16;
}

# 1. HTTP -> HTTPS www
server {
    listen 80;
    listen [::]:80;

    server_name banjaramatch.com www.banjaramatch.com;
    server_tokens off;

    return 301 https://www.banjaramatch.com$request_uri;
}

# 2. apex HTTPS -> www (assetlinks served directly: App Links verification does not follow redirects)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name banjaramatch.com;

    ssl_certificate /etc/letsencrypt/live/banjaramatch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/banjaramatch.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    location = /.well-known/assetlinks.json {
        proxy_pass http://bm_web;
        include /etc/nginx/snippets/banjaramatch/proxy.conf;
    }

    location / {
        return 301 https://www.banjaramatch.com$request_uri;
    }
}

# 3. www HTTPS main
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.banjaramatch.com;

    ssl_certificate /etc/letsencrypt/live/banjaramatch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/banjaramatch.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/banjaramatch.access.log;
    error_log /var/log/nginx/banjaramatch.error.log;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    # www takes no direct uploads; browser photo uploads go through /api/ below.
    client_max_body_size 2m;

    # No server-level HSTS/nosniff/Referrer-Policy here: the web app (helmet)
    # sends them on every proxied response. nginx-served locations below add their own.

    # GitHub push webhook -> deploy listener (loopback only)
    location = /deploy-webhook {
        proxy_pass http://127.0.0.1:4003;
        include /etc/nginx/snippets/banjaramatch/proxy.conf;
        client_max_body_size 2m;
    }

    location = /health {
        proxy_pass http://bm_web;
        include /etc/nginx/snippets/banjaramatch/proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/banjaramatch/security-headers.conf;
    }

    location = /.well-known/assetlinks.json {
        proxy_pass http://bm_web;
        include /etc/nginx/snippets/banjaramatch/proxy.conf;
    }

    # Static assets served by nginx (same URLs and max-age values as the Express static config)
    location ^~ /css/ {
        alias /var/www/banjaramatch/apps/web/public/css/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        include /etc/nginx/snippets/banjaramatch/security-headers.conf;
    }

    location ^~ /js/ {
        alias /var/www/banjaramatch/apps/web/public/js/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        include /etc/nginx/snippets/banjaramatch/security-headers.conf;
    }

    # /images/blog/ is a symlink into the shared dir; nginx follows it.
    location ^~ /images/ {
        alias /var/www/banjaramatch/apps/web/public/images/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        include /etc/nginx/snippets/banjaramatch/security-headers.conf;
    }

    location ^~ /fonts/ {
        alias /var/www/banjaramatch/apps/web/public/fonts/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        include /etc/nginx/snippets/banjaramatch/security-headers.conf;
    }

    # Hashed build output (untracked, produced by npm run build)
    location ^~ /build/ {
        alias /var/www/banjaramatch/apps/web/public/build/;
        try_files $uri =404;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/banjaramatch/security-headers.conf;
    }

    # APK and other downloads from the shared dir, never through Node
    location ^~ /downloads/ {
        alias /var/www/banjaramatch-shared/downloads/;
        try_files $uri =404;
        gzip off;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/banjaramatch/security-headers.conf;
    }

    # Browser socket: same-origin handshake, proxied to the API
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Served by the web app today; it will proxy to the API later.
    location ^~ /api/ {
        proxy_pass http://bm_web;
        include /etc/nginx/snippets/banjaramatch/proxy.conf;
        client_max_body_size 60m;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://bm_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bm_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
